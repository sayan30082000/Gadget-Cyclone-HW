<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta
      name="description"
      content="Gadget Cyclone: phone accessories at Finlay Square, Chattogram. Earbuds, chargers, power banks and covers. Cash on delivery, no advance."
    />
    <script>
      // apply the saved theme before the first paint (light is the default)
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
    <title>Gadget Cyclone · Accessories for the phone you already own</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
